<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haus der Worte Deutsch - Flashcards & Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="h-full bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 flex flex-col justify-between selection:bg-teal-500 selection:text-white">

    <!-- Header Section -->
    <header class="w-full py-6 px-6 text-center border-b border-slate-800/80 backdrop-blur-md bg-slate-900/50 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-teal-500/30">
                    <i class="fa-solid fa-book-open-reader text-slate-950 text-lg"></i>
                </div>
                <div class="text-left">
                    <h1 class="text-xl font-bold tracking-tight text-white">Haus der Worte Deutsch</h1>
                    <p class="text-xs text-slate-400">700+ Vocabulary Flashcards & Reference Portal</p>
                </div>
            </div>

            <!-- View Toggle Controls -->
            <div class="flex items-center bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 shadow-inner">
                <button onclick="switchView('flashcard')" id="btnFlashcard" class="px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 bg-teal-600 text-white shadow-md">
                    <i class="fa-solid fa-clone"></i> Flashcard View
                </button>
                <button onclick="switchView('table')" id="btnTable" class="px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-table-list"></i> Side-by-Side Table
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-6 py-8 flex flex-col">
        
        <!-- Search and Filter Bar -->
        <div class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50 backdrop-blur-sm">
            <div class="relative w-full sm:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search text-xs"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterCards()" placeholder="Search German or translation across 700+ cards..." class="w-full bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-teal-500 transition-colors">
            </div>
            <div class="text-xs text-slate-400 font-medium">
                Showing <span id="cardCount" class="text-teal-400 font-bold">0</span> entries
            </div>
        </div>

        <!-- VIEW 1: Flashcard View -->
        <section id="flashcardView" class="w-full">
            <div id="flashcardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards dynamically populated via JS -->
            </div>
        </section>

        <!-- VIEW 2: Side-by-Side Table View -->
        <section id="tableView" class="w-full hidden">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-md">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-700/80 bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider font-semibold">
                                <th class="py-4 px-6">German Term / Phrase</th>
                                <th class="py-4 px-6">Translation / Definition</th>
                                <th class="py-4 px-6 w-24 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-700/40 text-sm text-slate-200">
                            <!-- Table rows dynamically populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Custom Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <div class="w-6 h-6 rounded-full bg-teal-500/20 text-teal-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastMessage" class="text-sm font-medium">Action completed!</span>
    </div>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-slate-500 border-t border-slate-800/80">
        <p>&copy; 2026 TerraNova Eng & German. All rights reserved.</p>
    </footer>

    <!-- GoatCounter Analytics Tracker -->
    <script data-goatcounter="https://paulacavalcanti.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>

    <!-- Application Script -->
    <script>
        // Sample vocabulary dataset (Easily expandable to your 700+ records)
        const vocabularyData = [
            { id: 1, german: "das Haus der Worte", translation: "The House of Words" },
            { id: 2, german: "die Bildung", translation: "Education / Formation" },
            { id: 3, german: "die Wissenschaft", translation: "Science / Scholarship" },
            { id: 4, german: "die Aerodynamik", translation: "Aerodynamics" },
            { id: 5, german: "die Raumfahrt", translation: "Space travel / Astronautics" },
            { id: 6, german: "der Lehrplan", translation: "Curriculum / Syllabus" },
            { id: 7, german: "die Programmiersprache", translation: "Programming language" },
            { id: 8, german: "die Synthese", translation: "Synthesis" }
        ];

        let currentView = 'flashcard';

        function switchView(view) {
            currentView = view;
            const fView = document.getElementById('flashcardView');
            const tView = document.getElementById('tableView');
            const btnF = document.getElementById('btnFlashcard');
            const btnT = document.getElementById('btnTable');

            if (view === 'flashcard') {
                fView.classList.remove('hidden');
                tView.classList.add('hidden');
                btnF.className = "px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 bg-teal-600 text-white shadow-md";
                btnT.className = "px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white";
            } else {
                fView.classList.add('hidden');
                tView.classList.remove('hidden');
                btnT.className = "px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 bg-teal-600 text-white shadow-md";
                btnF.className = "px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white";
            }
            renderData(vocabularyData);
        }

        function renderData(data) {
            const cardContainer = document.getElementById('flashcardContainer');
            const tableBody = document.getElementById('tableBody');
            document.getElementById('cardCount').textContent = data.length;

            // Render Flashcard View
            cardContainer.innerHTML = data.map(item => `
                <div class="group relative bg-slate-800/50 hover:bg-slate-800/80 border border-slate-700/60 hover:border-teal-500/50 rounded-2xl p-6 transition-all duration-300 shadow-xl flex flex-col justify-between">
                    <div>
                        <span class="text-[10px] font-mono text-teal-400 uppercase tracking-widest block mb-2">Card #${item.id}</span>
                        <h3 class="text-lg font-bold text-white mb-3">${item.german}</h3>
                        <p class="text-slate-400 text-sm leading-relaxed border-t border-slate-700/50 pt-3">${item.translation}</p>
                    </div>
                </div>
            `).join('');

            // Render Side-by-Side Table View
            tableBody.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-700/20 transition-colors">
                    <td class="py-4 px-6 font-semibold text-white">${item.german}</td>
                    <td class="py-4 px-6 text-slate-300">${item.translation}</td>
                    <td class="py-4 px-6 text-center">
                        <button onclick="speakWord('${item.german}')" class="p-2 rounded-lg bg-slate-800 hover:bg-teal-600 text-slate-300 hover:text-white transition-colors text-xs" title="Pronounce">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = vocabularyData.filter(item => 
                item.german.toLowerCase().includes(query) || 
                item.translation.toLowerCase().includes(query)
            );
            renderData(filtered);
        }

        function speakWord(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                window.speechSynthesis.speak(utterance);
                showToast(`Pronouncing: "${text}"`);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Initial render
        renderData(vocabularyData);
    </script>
</body>
</html>
